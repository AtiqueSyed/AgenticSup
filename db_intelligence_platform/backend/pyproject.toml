[project]
name = "backend"
version = "0.1.0"
description = "Enterprise Agentic Database Intelligence Platform API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.8.0",
    "elasticsearch[async]>=8.10.0,<9.0.0",
    "fastapi>=0.137.2",
    "fastembed>=0.2.7",
    "hazelcast-python-client>=5.6.0",
    "langgraph>=1.2.6",
    "motor[asyncio]>=3.7.1",
    "neo4j>=6.2.0",
    "openai>=2.43.0",
    "oracledb>=4.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn>=0.49.0",
    # --- OpenTelemetry ---
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-elasticsearch>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "radon>=6.0.1",
    "openpyxl>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.uv]
package = false
